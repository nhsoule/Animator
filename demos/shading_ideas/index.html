<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Shading ideas</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1f24; color: #e7e4de; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #label { position: fixed; left: 14px; top: 14px; margin: 0; padding: 6px 10px; background: rgba(20, 24, 30, 0.78); border-radius: 6px; }
  #hud { position: fixed; left: 14px; bottom: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { background: #3a4250; color: inherit; border: 0; border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button.on { background: #3d6b8a; }
  button:focus-visible { outline: 2px solid #d7c27a; outline-offset: 2px; }
  #hint { color: #9aa3ad; font-size: 12px; }
  #error { display: none; position: fixed; left: 14px; right: 14px; top: 52px; margin: 0; padding: 10px 12px;
           background: #3a1618; color: #ffd4d4; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<p id="label">Flat baseline</p>
<div id="hud">
  <button id="mode0" type="button" data-mode="0">0 Flat</button>
  <button id="mode1" type="button" data-mode="1">1 Fog</button>
  <button id="mode2" type="button" data-mode="2">2 Specular</button>
  <button id="mode3" type="button" data-mode="3">3 Occlusion</button>
  <span id="hint">keys 0–3</span>
</div>
<pre id="error"></pre>
<script>
//----- Shading ideas -----||
// Four cheap looks on one cube scene. A mode replaces the flat term;
// the modes do not stack. The mesh carries a position, one flat face
// normal on all three corners, a smooth normal, albedo, and a baked
// occlusion term. Triangles are not indexed. Z is up.
//
// 0 Flat. Per-face Lambert, for comparison.
//   facing = max(dot(N, L), 0)
//   rgb = albedo * (vec3(0.46, 0.46, 0.50) + vec3(0.54, 0.52, 0.46) * facing)
//
// 1 Fog. View depth fades and desaturates toward the clear colour.
//   fog = 1 - exp(-FOG_DENSITY * max(viewZ - FOG_START, 0))
//   rgb = mix(mix(rgb, luma, fog), FOG_COLOR, fog)
//   The floor is long and a row of cubes recedes along it, so the
//   fog has a depth range to cross.
//
// 2 Specular. A tight Blinn-Phong lobe on the smooth normal.
//   H = normalize(L + V)
//   spec = pow(max(dot(Ns, H), 0), SPEC_POWER) * SPEC_GAIN
//   Lambert still uses the flat normal. Ns is the corner normal of
//   the cube, so the bright dot sits on the corner that faces H.
//
// 3 Occlusion. Baked once at load on the CPU, per vertex, into an
//   attribute. The fragment shader only multiplies by it.
//   Each vertex casts a fixed set of hemisphere rays and darkens by
//   how soon those rays meet another box. A lone convex cube has no
//   concave corner, so the cubes sit on the floor, in a wall corner,
//   and beside each other. Contact edges and the inner corner go dark.

//----- Scene -----||
// World boxes. The floor runs away from the camera. Two walls and two
// cubes make a corner. The rest of the cubes step down the floor.

const CLEAR = [0.110, 0.122, 0.141];
const LOOK = [1.05, 2.7, 0.42];
const FOV_Y = 40 * Math.PI / 180;

const FLOOR_COLOR = [0.56, 0.57, 0.60];
const WALL_COLOR = [0.69, 0.66, 0.61];
const FLOOR_CELL = 0.26;
const SOLID_CELL = 0.2;

const SOLIDS = [
  { name: "floor", min: [-2.4, -1.7, -0.08], max: [4.8, 12.6, 0], color: FLOOR_COLOR, cell: FLOOR_CELL, smooth: false },
  { name: "wall-left", min: [-1.4, 0.2, 0], max: [-0.34, 2.3, 1.4], color: WALL_COLOR, cell: SOLID_CELL, smooth: false },
  { name: "wall-back", min: [-1.4, 2.02, 0], max: [1.2, 2.5, 1.22], color: WALL_COLOR, cell: SOLID_CELL, smooth: false },
  { name: "cube-a", min: [-0.08, 0.72, 0], max: [0.96, 1.76, 1.02], color: [0.84, 0.66, 0.46], cell: SOLID_CELL, smooth: true },
  { name: "cube-b", min: [1.28, 0.72, 0], max: [2.32, 1.76, 1.02], color: [0.55, 0.69, 0.64], cell: SOLID_CELL, smooth: true },
  { name: "cube-c", min: [2.42, 3.15, 0], max: [3.28, 4.01, 0.9], color: [0.80, 0.56, 0.40], cell: SOLID_CELL, smooth: true },
  { name: "cube-d", min: [1.62, 5.1, 0], max: [2.48, 5.96, 0.9], color: [0.48, 0.62, 0.70], cell: SOLID_CELL, smooth: true },
  { name: "cube-e", min: [2.5, 7.05, 0], max: [3.36, 7.91, 0.9], color: [0.78, 0.70, 0.46], cell: SOLID_CELL, smooth: true },
  { name: "cube-f", min: [1.78, 9.05, 0], max: [2.64, 9.91, 0.9], color: [0.66, 0.54, 0.56], cell: SOLID_CELL, smooth: true },
  { name: "cube-g", min: [2.4, 10.9, 0], max: [3.26, 11.76, 0.9], color: [0.46, 0.60, 0.54], cell: SOLID_CELL, smooth: true },
];

// Corner of cube-b that the camera sees: +X, -Y, +Z.
const SPEC_POINT = [2.32, 0.72, 1.02];
const SPEC_NORMAL = normalize([1, -1, 1]);

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function length3(a) { return Math.hypot(a[0], a[1], a[2]); }
function normalize(a) {
  const len = length3(a) || 1;
  return [a[0] / len, a[1] / len, a[2] / len];
}
function sub3(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function add3(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function scale3(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function lerp3(a, b, t) { return add3(a, scale3(sub3(b, a), t)); }

function divs(len, cell) {
  return Math.max(1, Math.round(len / cell));
}

function smoothAt(p, min, max) {
  const n = [0, 0, 0];
  const eps = 1e-4;
  if (p[0] <= min[0] + eps) n[0] = -1;
  else if (p[0] >= max[0] - eps) n[0] = 1;
  if (p[1] <= min[1] + eps) n[1] = -1;
  else if (p[1] >= max[1] - eps) n[1] = 1;
  if (p[2] <= min[2] + eps) n[2] = -1;
  else if (p[2] >= max[2] - eps) n[2] = 1;
  const len = length3(n);
  if (len < 0.5) return [0, 0, 1];
  return [n[0] / len, n[1] / len, n[2] / len];
}

function buildScene() {
  const pos = [];
  const nrm = [];
  const smo = [];
  const col = [];
  const ids = [];
  const boxes = [];

  function addFace(corners, nu, nv, normal, albedo, min, max, id, smooth) {
    const p00 = corners[0];
    const p10 = corners[1];
    const p11 = corners[2];
    const p01 = corners[3];
    function at(u, v) {
      const a = lerp3(p00, p10, u);
      const b = lerp3(p01, p11, u);
      return lerp3(a, b, v);
    }
    function push(p) {
      pos.push(p[0], p[1], p[2]);
      nrm.push(normal[0], normal[1], normal[2]);
      const s = smooth ? smoothAt(p, min, max) : normal;
      smo.push(s[0], s[1], s[2]);
      col.push(albedo[0], albedo[1], albedo[2]);
      ids.push(id);
    }
    for (let j = 0; j < nv; j++) {
      for (let i = 0; i < nu; i++) {
        const u0 = i / nu;
        const u1 = (i + 1) / nu;
        const v0 = j / nv;
        const v1 = (j + 1) / nv;
        const a = at(u0, v0);
        const b = at(u1, v0);
        const c = at(u1, v1);
        const d = at(u0, v1);
        push(a); push(b); push(c);
        push(a); push(c); push(d);
      }
    }
  }

  function addBox(solid) {
    const min = solid.min;
    const max = solid.max;
    const id = boxes.length;
    boxes.push({ min: min, max: max, id: id });
    const x0 = min[0], y0 = min[1], z0 = min[2];
    const x1 = max[0], y1 = max[1], z1 = max[2];
    const nx = divs(x1 - x0, solid.cell);
    const ny = divs(y1 - y0, solid.cell);
    const nz = divs(z1 - z0, solid.cell);
    const color = solid.color;
    const smooth = solid.smooth;
    // Corners run CCW when seen from outside.
    addFace([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], nx, ny, [0, 0, 1], color, min, max, id, smooth);
    addFace([[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], nx, ny, [0, 0, -1], color, min, max, id, smooth);
    addFace([[x1, y1, z0], [x0, y1, z0], [x0, y1, z1], [x1, y1, z1]], nx, nz, [0, 1, 0], color, min, max, id, smooth);
    addFace([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], nx, nz, [0, -1, 0], color, min, max, id, smooth);
    addFace([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], ny, nz, [1, 0, 0], color, min, max, id, smooth);
    addFace([[x0, y1, z0], [x0, y0, z0], [x0, y0, z1], [x0, y1, z1]], ny, nz, [-1, 0, 0], color, min, max, id, smooth);
  }

  for (let i = 0; i < SOLIDS.length; i++) addBox(SOLIDS[i]);

  const count = pos.length / 3;
  for (let v = 0; v < count; v += 3) {
    const i = v * 3;
    const ax = pos[i + 3] - pos[i];
    const ay = pos[i + 4] - pos[i + 1];
    const az = pos[i + 5] - pos[i + 2];
    const bx = pos[i + 6] - pos[i];
    const by = pos[i + 7] - pos[i + 1];
    const bz = pos[i + 8] - pos[i + 2];
    const cx = ay * bz - az * by;
    const cy = az * bx - ax * bz;
    const cz = ax * by - ay * bx;
    const facingOut = cx * nrm[i] + cy * nrm[i + 1] + cz * nrm[i + 2];
    if (facingOut <= 1e-8) throw new Error("winding at vertex " + v);
  }

  const ao = bakeAo(pos, nrm, ids, boxes);
  return {
    pos: new Float32Array(pos),
    nrm: new Float32Array(nrm),
    smo: new Float32Array(smo),
    col: new Float32Array(col),
    ao: new Float32Array(ao),
    count: count,
  };
}

//----- Ambient occlusion -----||
// One bake at load. A vertex darkens when rays in its outward hemisphere
// hit another box before AO_RADIUS. Closer hits count more. The result
// is a multiplier in [AO_MIN, 1], stored on the vertex.

const AO_SAMPLES = 48;
const AO_RADIUS = 1.25;
const AO_STRENGTH = 1.55;
const AO_MIN = 0.32;
const AO_BIAS = 0.02;

function rayAabb(origin, dir, box, maxT) {
  let tmin = 0;
  let tmax = maxT;
  const bmin = box.min;
  const bmax = box.max;
  for (let a = 0; a < 3; a++) {
    const da = dir[a];
    if (Math.abs(da) < 1e-8) {
      if (origin[a] < bmin[a] || origin[a] > bmax[a]) return null;
      continue;
    }
    const inv = 1 / da;
    let t0 = (bmin[a] - origin[a]) * inv;
    let t1 = (bmax[a] - origin[a]) * inv;
    if (t0 > t1) {
      const swap = t0;
      t0 = t1;
      t1 = swap;
    }
    if (t0 > tmin) tmin = t0;
    if (t1 < tmax) tmax = t1;
    if (tmax < tmin) return null;
  }
  if (tmax < 0) return null;
  if (tmin < 0) return 0;
  return tmin;
}

function hemiDir(i, normal) {
  // Cosine-weighted direction around +Z, then rotated onto the normal.
  const z = Math.sqrt((i + 0.5) / AO_SAMPLES);
  const r = Math.sqrt(Math.max(0, 1 - z * z));
  const theta = Math.PI * (3 - Math.sqrt(5)) * i;
  const lx = Math.cos(theta) * r;
  const ly = Math.sin(theta) * r;
  const helper = Math.abs(normal[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
  const tangent = normalize(cross(helper, normal));
  const bitangent = cross(normal, tangent);
  return [
    tangent[0] * lx + bitangent[0] * ly + normal[0] * z,
    tangent[1] * lx + bitangent[1] * ly + normal[1] * z,
    tangent[2] * lx + bitangent[2] * ly + normal[2] * z,
  ];
}

function bakeAo(pos, nrm, ids, boxes) {
  const count = pos.length / 3;
  const ao = new Array(count);
  let lo = 1;
  let hi = 0;
  for (let v = 0; v < count; v++) {
    const i = v * 3;
    const n = [nrm[i], nrm[i + 1], nrm[i + 2]];
    const origin = [
      pos[i] + n[0] * AO_BIAS,
      pos[i + 1] + n[1] * AO_BIAS,
      pos[i + 2] + n[2] * AO_BIAS,
    ];
    const self = ids[v];
    let acc = 0;
    for (let s = 0; s < AO_SAMPLES; s++) {
      const dir = hemiDir(s, n);
      let best = AO_RADIUS;
      for (let b = 0; b < boxes.length; b++) {
        if (boxes[b].id === self) continue;
        const t = rayAabb(origin, dir, boxes[b], best);
        if (t !== null && t < best) best = t;
      }
      if (best < AO_RADIUS) acc += 1 - best / AO_RADIUS;
    }
    let term = 1 - (acc / AO_SAMPLES) * AO_STRENGTH;
    term = clamp(term, AO_MIN, 1);
    ao[v] = term;
    if (term < lo) lo = term;
    if (term > hi) hi = term;
  }
  bakeAo.lo = lo;
  bakeAo.hi = hi;
  return ao;
}

//----- Shaders -----||

const VS = `#version 300 es
precision highp float;
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec3 aNrm;
layout(location = 2) in vec3 aSmooth;
layout(location = 3) in vec3 aCol;
layout(location = 4) in float aAo;
uniform mat4 uViewProj;
uniform mat4 uView;
out vec3 vWorld;
out float vViewZ;
flat out vec3 vN;
out vec3 vNs;
out vec3 vCol;
out float vAo;
void main() {
  vec4 world = vec4(aPos, 1.0);
  vec4 view = uView * world;
  vWorld = aPos;
  vViewZ = -view.z;
  vN = aNrm;
  vNs = aSmooth;
  vCol = aCol;
  vAo = aAo;
  gl_Position = uViewProj * world;
}
`;

const FS = `#version 300 es
precision highp float;

//----- Fog -----||
const vec3 FOG_COLOR = vec3(0.110, 0.122, 0.141);
const float FOG_DENSITY = 0.145;
const float FOG_START = 2.6;

//----- Specular -----||
const float SPEC_POWER = 32.0;
const float SPEC_GAIN = 0.58;

in vec3 vWorld;
in float vViewZ;
flat in vec3 vN;
in vec3 vNs;
in vec3 vCol;
in float vAo;
uniform vec3 uLight;
uniform vec3 uEye;
uniform int uMode;
out vec4 frag;

void main() {
  vec3 N = normalize(vN);
  vec3 L = normalize(uLight);
  float facing = max(dot(N, L), 0.0);
  //----- Lambert -----||
  vec3 rgb = vCol * (vec3(0.46, 0.46, 0.50) + vec3(0.54, 0.52, 0.46) * facing);

  if (uMode == 2) {
    vec3 V = normalize(uEye - vWorld);
    vec3 H = normalize(L + V);
    float ndh = max(dot(normalize(vNs), H), 0.0);
    float spec = pow(ndh, SPEC_POWER) * SPEC_GAIN;
    if (facing <= 0.0) spec = 0.0;
    rgb += vec3(1.0, 0.98, 0.93) * spec;
  } else if (uMode == 3) {
    rgb *= vAo;
  }

  if (uMode == 1) {
    float dist = max(vViewZ - FOG_START, 0.0);
    float fog = clamp(1.0 - exp(-FOG_DENSITY * dist), 0.0, 1.0);
    float luma = dot(rgb, vec3(0.299, 0.587, 0.114));
    rgb = mix(rgb, vec3(luma), fog);
    rgb = mix(rgb, FOG_COLOR, fog);
  }

  frag = vec4(rgb, 1.0);
}
`;

//----- Draw -----||

const MODES = [
  "Flat baseline",
  "Distance fog",
  "Specular highlight",
  "Baked ambient occlusion",
];

const canvas = document.getElementById("view");
const errorBox = document.getElementById("error");
const label = document.getElementById("label");
const buttons = [
  document.getElementById("mode0"),
  document.getElementById("mode1"),
  document.getElementById("mode2"),
  document.getElementById("mode3"),
];

const demo = {
  mode: 0,
  angle: 0,
  freeze: false,
  ready: false,
  frames: 0,
  glError: 0,
  aoMin: 1,
  aoMax: 0,
  count: 0,
  light: [0, 0, 1],
};
window.__demo = demo;

function fail(msg) {
  demo.ready = false;
  errorBox.style.display = "block";
  errorBox.textContent = msg;
  console.error(msg);
}

function eyeFor(angle) {
  const yaw = Math.sin(angle) * 0.22;
  const c = Math.cos(yaw);
  const s = Math.sin(yaw);
  const x = 3.05;
  const y = -1.85;
  return [x * c - y * s, x * s + y * c, 1.7];
}

function aimedLight(eye, point, normal) {
  // H = normal at this corner, so L + V is parallel to the normal.
  const V = normalize(sub3(eye, point));
  return normalize(sub3(scale3(normal, 2), V));
}

function compile(gl, type, src) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, src);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(shader) || "compile failed";
    const name = type === gl.VERTEX_SHADER ? "vertex shader" : "fragment shader";
    fail(name + ":\n" + log);
    gl.deleteShader(shader);
    return null;
  }
  return shader;
}

function link(gl, vs, fs) {
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    fail("link:\n" + (gl.getProgramInfoLog(program) || "link failed"));
    gl.deleteProgram(program);
    return null;
  }
  return program;
}

function mat4Multiply(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) {
    for (let r = 0; r < 4; r++) {
      o[c * 4 + r] =
        a[r] * b[c * 4] +
        a[4 + r] * b[c * 4 + 1] +
        a[8 + r] * b[c * 4 + 2] +
        a[12 + r] * b[c * 4 + 3];
    }
  }
  return o;
}

function mat4Perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2);
  const nf = 1 / (near - far);
  const o = new Float32Array(16);
  o[0] = f / aspect;
  o[5] = f;
  o[10] = (far + near) * nf;
  o[11] = -1;
  o[14] = 2 * far * near * nf;
  return o;
}

function mat4LookAt(eye, center, up) {
  let zx = eye[0] - center[0];
  let zy = eye[1] - center[1];
  let zz = eye[2] - center[2];
  let len = Math.hypot(zx, zy, zz);
  zx /= len; zy /= len; zz /= len;
  let xx = up[1] * zz - up[2] * zy;
  let xy = up[2] * zx - up[0] * zz;
  let xz = up[0] * zy - up[1] * zx;
  len = Math.hypot(xx, xy, xz);
  xx /= len; xy /= len; xz /= len;
  const yx = zy * xz - zz * xy;
  const yy = zz * xx - zx * xz;
  const yz = zx * xy - zy * xx;
  const o = new Float32Array(16);
  o[0] = xx; o[1] = yx; o[2] = zx;
  o[4] = xy; o[5] = yy; o[6] = zy;
  o[8] = xz; o[9] = yz; o[10] = zz;
  o[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
  o[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
  o[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
  o[15] = 1;
  return o;
}

const gl = canvas.getContext("webgl2", {
  alpha: false,
  antialias: true,
  depth: true,
  preserveDrawingBuffer: true,
});
if (!gl) fail("WebGL2 is not available");

let program = null;
let mesh = null;
let uViewProj = null;
let uView = null;
let uLight = null;
let uEye = null;
let uMode = null;

if (gl) {
  try {
    const vs = compile(gl, gl.VERTEX_SHADER, VS);
    const fs = vs && compile(gl, gl.FRAGMENT_SHADER, FS);
    program = vs && fs && link(gl, vs, fs);
    if (program) {
      uViewProj = gl.getUniformLocation(program, "uViewProj");
      uView = gl.getUniformLocation(program, "uView");
      uLight = gl.getUniformLocation(program, "uLight");
      uEye = gl.getUniformLocation(program, "uEye");
      uMode = gl.getUniformLocation(program, "uMode");
      mesh = buildScene();
      demo.aoMin = bakeAo.lo;
      demo.aoMax = bakeAo.hi;
      demo.count = mesh.count;
      demo.light = aimedLight(eyeFor(0), SPEC_POINT, SPEC_NORMAL);
      const buffer = gl.createBuffer();
      const packed = new Float32Array(mesh.count * 13);
      for (let i = 0; i < mesh.count; i++) {
        const o = i * 13;
        packed.set(mesh.pos.subarray(i * 3, i * 3 + 3), o);
        packed.set(mesh.nrm.subarray(i * 3, i * 3 + 3), o + 3);
        packed.set(mesh.smo.subarray(i * 3, i * 3 + 3), o + 6);
        packed.set(mesh.col.subarray(i * 3, i * 3 + 3), o + 9);
        packed[o + 12] = mesh.ao[i];
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, packed, gl.STATIC_DRAW);
      const stride = 13 * 4;
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, stride, 0);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 12);
      gl.enableVertexAttribArray(2);
      gl.vertexAttribPointer(2, 3, gl.FLOAT, false, stride, 24);
      gl.enableVertexAttribArray(3);
      gl.vertexAttribPointer(3, 3, gl.FLOAT, false, stride, 36);
      gl.enableVertexAttribArray(4);
      gl.vertexAttribPointer(4, 1, gl.FLOAT, false, stride, 48);
      gl.enable(gl.DEPTH_TEST);
      gl.enable(gl.CULL_FACE);
      gl.cullFace(gl.BACK);
      gl.frontFace(gl.CCW);
      demo.ready = true;
    }
  } catch (err) {
    fail(err && err.stack ? err.stack : String(err));
  }
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
  const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
}

function draw() {
  if (!demo.ready) return;
  resize();
  const w = canvas.width;
  const h = canvas.height;
  const eye = eyeFor(demo.angle);
  gl.viewport(0, 0, w, h);
  gl.clearColor(CLEAR[0], CLEAR[1], CLEAR[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const aspect = w / Math.max(1, h);
  const view = mat4LookAt(eye, LOOK, [0, 0, 1]);
  const proj = mat4Perspective(FOV_Y, aspect, 0.08, 60);
  const viewProj = mat4Multiply(proj, view);
  gl.useProgram(program);
  gl.uniformMatrix4fv(uViewProj, false, viewProj);
  gl.uniformMatrix4fv(uView, false, view);
  gl.uniform3fv(uLight, demo.light);
  gl.uniform3fv(uEye, eye);
  gl.uniform1i(uMode, demo.mode);
  gl.drawArrays(gl.TRIANGLES, 0, mesh.count);
  const err = gl.getError();
  if (err !== 0 && demo.glError === 0) {
    demo.glError = err;
    fail("gl error " + err);
  }
  demo.frames += 1;
}

demo.redraw = draw;

function applyMode() {
  const name = MODES[demo.mode] || MODES[0];
  label.textContent = demo.mode + "  " + name;
  for (let i = 0; i < buttons.length; i++) {
    const on = i === demo.mode;
    buttons[i].classList.toggle("on", on);
    buttons[i].setAttribute("aria-pressed", on ? "true" : "false");
  }
}

demo.setMode = function (mode) {
  const next = mode | 0;
  if (next < 0 || next > 3) return;
  demo.mode = next;
  applyMode();
};

//----- Input -----||

for (let i = 0; i < buttons.length; i++) {
  buttons[i].addEventListener("click", () => {
    demo.setMode(i);
  });
}

window.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = "0123".indexOf(e.key);
  if (n >= 0) demo.setMode(n);
});

let lastTime = 0;
function tick(now) {
  const dt = lastTime ? Math.min(0.05, (now - lastTime) / 1000) : 0;
  lastTime = now;
  if (!demo.freeze) demo.angle += dt * 0.45;
  draw();
  requestAnimationFrame(tick);
}

const params = new URLSearchParams(location.search);
if (params.has("mode")) {
  const m = Number(params.get("mode"));
  if (m >= 0 && m <= 3) demo.mode = m;
}
if (params.get("freeze") === "1") demo.freeze = true;
if (params.has("angle")) {
  const a = Number(params.get("angle"));
  if (Number.isFinite(a)) demo.angle = a;
}

applyMode();
if (demo.ready) requestAnimationFrame(tick);
</script>
</body>
</html>
