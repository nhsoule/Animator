<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animator</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c1f24; color: #e7e4de; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  body { display: flex; overflow: hidden; }
  #canvas { flex: 1; min-width: 0; height: 100%; display: block; touch-action: none; }
  #panel { width: 260px; flex: none; overflow: auto; background: #262b33; padding: 14px 14px 24px; box-sizing: border-box; }
  h1 { font-size: 16px; font-weight: 650; margin: 0 0 10px; letter-spacing: 0.02em; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  button { background: #3a4250; color: inherit; border: 0; border-radius: 6px; padding: 7px 10px; font: inherit; cursor: pointer; }
  button.on { background: #3d6b8a; }
  label.slider { display: block; margin: 12px 0 4px; }
  label.slider span { float: right; font-variant-numeric: tabular-nums; color: #c5d0da; }
  input[type="range"] { width: 100%; margin: 0; }
  #busy { color: #d7c27a; min-height: 1.2em; }
  #hint { color: #9aa3ad; font-size: 12px; margin-top: 14px; }
  #error { display: none; position: fixed; left: 12px; bottom: 12px; right: 280px; max-height: 42%; overflow: auto;
           background: #3a1618; color: #ffd4d4; font: 12px/1.45 ui-monospace, monospace; padding: 10px 12px;
           white-space: pre-wrap; border-radius: 8px; }
  @media (max-width: 720px) {
    body { flex-direction: column; }
    #canvas { width: 100%; height: 58%; flex: none; }
    #panel { width: auto; height: 42%; }
    #error { right: 12px; bottom: 44%; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<aside id="panel">
  <h1>Animator</h1>
  <div id="busy">Starting…</div>
  <div class="row">
    <button id="play" type="button">Pause</button>
    <button id="place" type="button">Place</button>
  </div>
  <label class="slider">time scale <span id="scale-val">1.00</span></label>
  <input id="scale" type="range" min="0" max="4" step="0.05" value="1">
  <div id="sliders"></div>
  <p id="hint">Drag to orbit. Right-drag or Shift-drag to pan. Scroll to zoom. Place turns the left button / one finger into a ground drag the scene can read. Two fingers orbit while Place is on; pinch zooms; three fingers pan.</p>
</aside>
<pre id="error"></pre>
<script src="viewer.js"></script>
</body>
</html>
